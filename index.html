<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Moodboard Studio — Home Design Brief Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#F3F0EA;font-family:'DM Sans',sans-serif;color:#1A1814;}
input,textarea,select,button{font-family:'DM Sans',sans-serif;}
input:focus,textarea:focus,select:focus{outline:none;border-color:#B59A7C!important;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
.chip{display:inline-flex;align-items:center;padding:6px 16px;border-radius:100px;border:1.5px solid #DDD8CF;background:#fff;color:#665F55;font-size:13px;cursor:pointer;transition:all .15s;}
.chip:hover{border-color:#B59A7C;color:#7C6248;}
.chip.on{border-color:#7C6248;background:#7C6248;color:#fff;font-weight:500;}
.gen-btn{transition:all .2s!important;}
.gen-btn:hover:not(:disabled){background:#6A5238!important;transform:translateY(-1px);box-shadow:0 6px 22px rgba(124,98,72,.38)!important;}
.gen-btn:disabled{opacity:.45;cursor:not-allowed;}
.upload-zone{border:2px dashed #DDD8CF;border-radius:12px;padding:36px 24px;text-align:center;cursor:pointer;transition:all .2s;background:#FAFAF8;}
.upload-zone:hover,.upload-zone.drag{border-color:#B59A7C;background:#F8F4EF;}
.room-card{transition:border-color .2s,box-shadow .2s;}
.room-card:hover{border-color:#B59A7C!important;box-shadow:0 4px 18px rgba(0,0,0,.09)!important;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes dotpulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.25);}}
.fu{animation:fadeUp .5s ease forwards;}
.fu1{animation:fadeUp .5s .05s ease both;}
.fu2{animation:fadeUp .5s .12s ease both;}
.fu3{animation:fadeUp .5s .20s ease both;}
.fu4{animation:fadeUp .5s .28s ease both;}
.fu5{animation:fadeUp .5s .36s ease both;}
.d1{animation:dotpulse 1.4s ease infinite;}
.d2{animation:dotpulse 1.4s .2s ease infinite;}
.d3{animation:dotpulse 1.4s .4s ease infinite;}
@media print{.no-print{display:none!important;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef}=React;
const STYLES=["Minimalist Modern","Scandinavian","Industrial","Tropical Contemporary","Japandi","Mid-Century Modern","Bohemian","Coastal","Contemporary Asian","Art Deco","Traditional Malay","Peranakan"];
const COLOR_TONES=["Warm Neutrals","Cool Tones","Earthy Naturals","Bold & Vibrant","Monochromatic","Black & White","Pastel Soft","Deep & Moody","Natural Wood Tones"];
const ROOM_PRESETS=["Living Room","Master Bedroom","Kitchen","Dining Room","Secondary Bedroom","Children's Room","Home Office","Master Bathroom","Guest Bathroom","Foyer / Entrance"];
const BUDGETS=["Economy (RM50–100k)","Mid-Range (RM100–200k)","Premium (RM200–400k)","Luxury (RM400k+)"];

function Chip({label,active,onClick}){return <button className={`chip${active?" on":""}`} onClick={onClick} type="button">{label}</button>;}
function Label({children,req}){return(<label style={{display:"block",fontSize:"13px",fontWeight:"500",color:"#665F55",marginBottom:"8px",letterSpacing:".02em"}}>{children}{req&&<span style={{color:"#C4956A"}}> *</span>}</label>);}
function SecTitle({children}){return(<div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"18px"}}><div style={{width:"3px",height:"18px",background:"#7C6248",borderRadius:"2px"}}/><h3 style={{fontFamily:"'Playfair Display',serif",fontSize:"16px",fontWeight:"600",color:"#1A1814"}}>{children}</h3></div>);}
function Card({children,style={}}){return <div style={{background:"#fff",borderRadius:"16px",padding:"28px",boxShadow:"0 1px 5px rgba(0,0,0,.06)",...style}}>{children}</div>;}

function MoodboardApp(){
  const [step,setStep]=useState("input");
  const [form,setForm]=useState({projectName:"",ownerName:"",colorTones:[],styles:[],rooms:3,houseSize:"",unit:"sq ft",budget:"",notes:""});
  const [imgPreview,setImgPreview]=useState(null);
  const [imgB64,setImgB64]=useState(null);
  const [imgMime,setImgMime]=useState("image/jpeg");
  const [moodboard,setMoodboard]=useState(null);
  const [errorMsg,setErrorMsg]=useState(null);
  const [dragOver,setDragOver]=useState(false);
  const fileRef=useRef();

  const handleImg=(file)=>{
    if(!file||!file.type.startsWith("image/"))return;
    setImgMime(file.type);
    const r=new FileReader();
    r.onload=(e)=>{setImgPreview(e.target.result);setImgB64(e.target.result.split(",")[1]);};
    r.readAsDataURL(file);
  };
  const toggle=(field,val)=>setForm(p=>({...p,[field]:p[field].includes(val)?p[field].filter(v=>v!==val):[...p[field],val]}));
  const canGenerate=form.colorTones.length>0||form.styles.length>0;

  const generate=async()=>{
    setStep("generating");setErrorMsg(null);
    try{
      const content=[];
      if(imgB64)content.push({type:"image",source:{type:"base64",media_type:imgMime,data:imgB64}});
      const roomNames=ROOM_PRESETS.slice(0,form.rooms).join(", ");
      content.push({type:"text",text:`You are a senior interior designer in Southeast Asia creating a professional moodboard brief for a homeowner-ID consultation. Consider Malaysian/Singaporean climate, lifestyle, and local market context.
PROJECT: ${form.projectName||"Home Renovation"} | Owner: ${form.ownerName||"Client"} | Colour Tones: ${form.colorTones.join(", ")||"Open"} | Style: ${form.styles.join(", ")||"Open"} | Rooms (${form.rooms}): ${roomNames} | Size: ${form.houseSize?`${form.houseSize} ${form.unit}`:"Not specified"} | Budget: ${form.budget||"Not specified"} | Notes: ${form.notes||"None"}${imgB64?" | Reference image provided above.":""}
Respond ONLY with valid JSON, no markdown:
{"title":"3-6 word title","tagline":"one poetic line","color_palette":[{"name":"","hex":"#XXXXXX","role":"","usage":""}],"style_keywords":["","","","","",""],"mood_description":"2-3 sentences","rooms":[{"name":"","style_direction":"","key_materials":[],"focal_pieces":[],"color_notes":"","lighting":""}],"material_palette":["","","","","",""],"simulation":"4-5 sentence present-tense walkthrough","designer_notes":"2-3 sentences","id_discussion_points":["","","","",""]}
REQUIREMENTS: Exactly ${form.rooms} rooms using: ${roomNames}. Exactly 5 colors. Valid CSS hex codes.`});

      const res=await fetch("/api/generate",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2500,messages:[{role:"user",content}]})
      });
      if(!res.ok){
        const err=await res.json().catch(()=>({}));
        throw new Error(err?.error?.message||`Server error ${res.status}`);
      }
      const data=await res.json();
      const raw=data.content.filter(b=>b.type==="text").map(b=>b.text).join("").trim();
      const match=raw.match(/\{[\s\S]*\}/);
      if(!match)throw new Error("Unexpected response from AI");
      setMoodboard(JSON.parse(match[0]));
      setStep("result");
    }catch(e){
      console.error(e);
      setErrorMsg(e.message);
      setStep("input");
    }
  };

  /* ── INPUT ── */
  if(step==="input")return(
    <div style={{minHeight:"100vh",background:"#F3F0EA",paddingBottom:"60px"}}>
      <div style={{background:"#1A1814",padding:"24px 32px"}}>
        <div style={{maxWidth:"780px",margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"baseline",gap:"12px",marginBottom:"4px"}}>
            <span style={{fontFamily:"'Playfair Display',serif",fontSize:"24px",fontWeight:"600",color:"#EDE8DF",letterSpacing:"-.02em"}}>Moodboard Studio</span>
            <span style={{fontSize:"11px",color:"#B59A7C",letterSpacing:".14em",textTransform:"uppercase"}}>by Koocester</span>
          </div>
          <p style={{fontSize:"13px",color:"#7A726A"}}>Generate a professional home design brief for your ID consultation — free, instant, no sign-up needed.</p>
        </div>
      </div>
      <div style={{maxWidth:"780px",margin:"28px auto 0",padding:"0 24px",display:"flex",flexDirection:"column",gap:"20px"}}>
        {errorMsg&&<div style={{background:"#FDF0F0",border:"1px solid #F5C5C5",borderRadius:"10px",padding:"14px 18px",color:"#B84040",fontSize:"14px"}}>⚠️ {errorMsg}</div>}
        <Card><SecTitle>Project Information</SecTitle>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:"16px"}}>
            <div><Label>Property / Project Name</Label><input value={form.projectName} onChange={e=>setForm(p=>({...p,projectName:e.target.value}))} placeholder="e.g. Damansara Heights Home" style={{width:"100%",padding:"10px 14px",borderRadius:"8px",border:"1.5px solid #DDD8CF",fontSize:"14px",background:"#FAFAF8"}}/></div>
            <div><Label>Homeowner Name</Label><input value={form.ownerName} onChange={e=>setForm(p=>({...p,ownerName:e.target.value}))} placeholder="e.g. Ahmad & Siti" style={{width:"100%",padding:"10px 14px",borderRadius:"8px",border:"1.5px solid #DDD8CF",fontSize:"14px",background:"#FAFAF8"}}/></div>
            <div><Label>House Size</Label><div style={{display:"flex",gap:"8px"}}><input type="number" value={form.houseSize} onChange={e=>setForm(p=>({...p,houseSize:e.target.value}))} placeholder="e.g. 1500" style={{flex:1,padding:"10px 14px",borderRadius:"8px",border:"1.5px solid #DDD8CF",fontSize:"14px",background:"#FAFAF8"}}/><select value={form.unit} onChange={e=>setForm(p=>({...p,unit:e.target.value}))} style={{padding:"10px 12px",borderRadius:"8px",border:"1.5px solid #DDD8CF",fontSize:"13px",background:"#FAFAF8",color:"#665F55"}}><option>sq ft</option><option>sq m</option></select></div></div>
            <div><Label>Number of Rooms</Label><div style={{display:"flex",alignItems:"center",gap:"14px",paddingTop:"4px"}}><button type="button" onClick={()=>setForm(p=>({...p,rooms:Math.max(1,p.rooms-1)}))} style={{width:"34px",height:"34px",borderRadius:"50%",border:"1.5px solid #DDD8CF",background:"#FAFAF8",fontSize:"20px",cursor:"pointer",color:"#665F55",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button><span style={{fontSize:"24px",fontWeight:"600",color:"#1A1814",minWidth:"28px",textAlign:"center"}}>{form.rooms}</span><button type="button" onClick={()=>setForm(p=>({...p,rooms:Math.min(10,p.rooms+1)}))} style={{width:"34px",height:"34px",borderRadius:"50%",border:"1.5px solid #DDD8CF",background:"#FAFAF8",fontSize:"20px",cursor:"pointer",color:"#665F55",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button><span style={{fontSize:"12px",color:"#A09890"}}>rooms</span></div></div>
            <div style={{gridColumn:"1/-1"}}><Label>Budget Range</Label><div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>{BUDGETS.map(b=><Chip key={b} label={b} active={form.budget===b} onClick={()=>setForm(p=>({...p,budget:p.budget===b?"":b}))}/>)}</div></div>
          </div>
        </Card>
        <Card><SecTitle>Style Preferences</SecTitle>
          <div style={{marginBottom:"22px"}}><Label req>Colour Tone <span style={{fontWeight:"400",color:"#A09890",fontSize:"12px"}}>(pick all that apply)</span></Label><div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>{COLOR_TONES.map(t=><Chip key={t} label={t} active={form.colorTones.includes(t)} onClick={()=>toggle("colorTones",t)}/>)}</div></div>
          <div><Label req>Interior Style <span style={{fontWeight:"400",color:"#A09890",fontSize:"12px"}}>(pick all that apply)</span></Label><div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>{STYLES.map(s=><Chip key={s} label={s} active={form.styles.includes(s)} onClick={()=>toggle("styles",s)}/>)}</div></div>
        </Card>
        <Card><SecTitle>Reference / Site Image <span style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"normal",fontSize:"13px",fontWeight:"400",color:"#A09890"}}>(optional)</span></SecTitle>
          <p style={{fontSize:"13px",color:"#A09890",marginBottom:"16px",lineHeight:"1.6"}}>Upload an inspiration photo or site image. The AI will factor it into the design direction.</p>
          {imgPreview?(<div style={{position:"relative",borderRadius:"10px",overflow:"hidden"}}><img src={imgPreview} alt="Reference" style={{width:"100%",height:"220px",objectFit:"cover",display:"block"}}/><button type="button" onClick={()=>{setImgPreview(null);setImgB64(null);}} style={{position:"absolute",top:"10px",right:"10px",background:"rgba(0,0,0,.6)",color:"#fff",border:"none",borderRadius:"50%",width:"28px",height:"28px",cursor:"pointer",fontSize:"16px",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button></div>):(
          <div className={`upload-zone${dragOver?" drag":""}`} onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={e=>{e.preventDefault();setDragOver(false);handleImg(e.dataTransfer.files[0]);}} onClick={()=>fileRef.current?.click()}><div style={{fontSize:"36px",marginBottom:"10px"}}>🖼️</div><div style={{fontSize:"14px",fontWeight:"500",color:"#665F55",marginBottom:"4px"}}>Drop image here or click to browse</div><div style={{fontSize:"12px",color:"#A09890"}}>JPEG · PNG · HEIC</div><input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleImg(e.target.files[0])}/></div>)}
        </Card>
        <Card><SecTitle>Additional Notes</SecTitle>
          <textarea value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} placeholder="Any specific requirements or lifestyle notes (e.g. have young children, love plants, need pet-friendly materials, work from home)..." rows={4} style={{width:"100%",padding:"12px 14px",borderRadius:"8px",border:"1.5px solid #DDD8CF",fontSize:"14px",background:"#FAFAF8",resize:"vertical",lineHeight:"1.6",color:"#1A1814"}}/>
        </Card>
        <div style={{textAlign:"center",paddingTop:"8px"}}>
          <button type="button" className="gen-btn" disabled={!canGenerate} onClick={generate} style={{padding:"16px 52px",borderRadius:"12px",border:"none",background:"#7C6248",color:"#fff",fontSize:"16px",fontWeight:"500",cursor:canGenerate?"pointer":"not-allowed",boxShadow:"0 3px 14px rgba(124,98,72,.3)",letterSpacing:".01em"}}>✦ &nbsp;Generate My Moodboard</button>
          {!canGenerate&&<p style={{fontSize:"12px",color:"#A09890",marginTop:"10px"}}>Select at least one colour tone or interior style to continue</p>}
        </div>
      </div>
    </div>
  );

  /* ── GENERATING ── */
  if(step==="generating")return(
    <div style={{minHeight:"100vh",background:"#F3F0EA",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"28px"}}>
      <div style={{width:"60px",height:"60px",border:"3px solid #DDD8CF",borderTopColor:"#7C6248",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
      <div style={{textAlign:"center"}}><p style={{fontFamily:"'Playfair Display',serif",fontSize:"22px",fontWeight:"600",color:"#1A1814",marginBottom:"8px"}}>Crafting your moodboard…</p><p style={{fontSize:"13px",color:"#A09890"}}>Analysing preferences{imgB64?" and reference image":""}…</p></div>
      <div style={{display:"flex",gap:"10px"}}><div className="d1" style={{width:"9px",height:"9px",borderRadius:"50%",background:"#7C6248"}}/><div className="d2" style={{width:"9px",height:"9px",borderRadius:"50%",background:"#7C6248"}}/><div className="d3" style={{width:"9px",height:"9px",borderRadius:"50%",background:"#7C6248"}}/></div>
    </div>
  );

  /* ── RESULT ── */
  const mb=moodboard;
  if(step==="result"&&mb)return(
    <div style={{minHeight:"100vh",background:"#F3F0EA",paddingBottom:"64px"}}>
      <div style={{background:"#1A1814",padding:"32px 32px 36px",marginBottom:"32px"}}>
        <div style={{maxWidth:"860px",margin:"0 auto"}}>
          <div className="no-print" style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"28px",flexWrap:"wrap",gap:"10px"}}>
            <button type="button" onClick={()=>{setStep("input");setMoodboard(null);}} style={{padding:"7px 16px",borderRadius:"7px",background:"#262220",border:"1px solid #3A3530",color:"#B59A7C",fontSize:"12px",cursor:"pointer"}}>← New Project</button>
            <button type="button" onClick={()=>window.print()} style={{padding:"7px 18px",borderRadius:"7px",background:"transparent",border:"1px solid #7C6248",color:"#B59A7C",fontSize:"12px",cursor:"pointer"}}>🖨 Print / Export PDF</button>
          </div>
          <div style={{fontSize:"11px",color:"#564E46",letterSpacing:".14em",textTransform:"uppercase",marginBottom:"10px"}}>Moodboard Brief · {form.ownerName||"Homeowner"} · {new Date().toLocaleDateString("en-MY",{day:"numeric",month:"long",year:"numeric"})}</div>
          <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(24px,4vw,38px)",fontWeight:"600",color:"#EDE8DF",letterSpacing:"-.02em",lineHeight:"1.2",marginBottom:"10px"}}>{mb.title}</h1>
          <p style={{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontSize:"16px",color:"#B59A7C",marginBottom:"22px"}}>{mb.tagline}</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>{(mb.style_keywords||[]).map(kw=><span key={kw} style={{padding:"4px 13px",borderRadius:"100px",background:"rgba(181,154,124,.12)",border:"1px solid rgba(181,154,124,.25)",color:"#C4A882",fontSize:"12px",letterSpacing:".05em"}}>{kw}</span>)}</div>
        </div>
      </div>
      <div style={{maxWidth:"860px",margin:"0 auto",padding:"0 24px",display:"flex",flexDirection:"column",gap:"22px"}}>
        <div className="fu"><Card>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"18px",fontWeight:"600",color:"#1A1814",marginBottom:"20px"}}>Colour Palette</h2>
          <div style={{display:"flex",height:"88px",borderRadius:"10px",overflow:"hidden",marginBottom:"20px",gap:"3px"}}>{(mb.color_palette||[]).map((c,i)=><div key={i} style={{flex:1,background:c.hex}} title={`${c.name} — ${c.hex}`}/>)}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"12px"}}>{(mb.color_palette||[]).map((c,i)=>(<div key={i} style={{textAlign:"center"}}><div style={{width:"36px",height:"36px",borderRadius:"50%",background:c.hex,margin:"0 auto 8px",boxShadow:"0 1px 5px rgba(0,0,0,.14)"}}/><div style={{fontSize:"12px",fontWeight:"500",color:"#1A1814",marginBottom:"2px",lineHeight:"1.3"}}>{c.name}</div><div style={{fontSize:"11px",color:"#A09890",fontFamily:"monospace",marginBottom:"3px"}}>{c.hex}</div><div style={{fontSize:"10px",color:"#B59A7C",textTransform:"uppercase",letterSpacing:".07em",marginBottom:"4px"}}>{c.role}</div><div style={{fontSize:"10px",color:"#A09890",lineHeight:"1.4"}}>{c.usage}</div></div>))}</div>
        </Card></div>
        <div className="fu1" style={{display:"grid",gridTemplateColumns:imgPreview?"1fr 260px":"1fr",gap:"20px",alignItems:"start"}}>
          <Card><h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"18px",fontWeight:"600",color:"#1A1814",marginBottom:"14px"}}>Design Mood</h2><p style={{fontSize:"15px",lineHeight:"1.75",color:"#3A3530",marginBottom:mb.material_palette?.length?"20px":"0"}}>{mb.mood_description}</p>{mb.material_palette?.length>0&&<><div style={{fontSize:"11px",fontWeight:"500",color:"#A09890",letterSpacing:".1em",textTransform:"uppercase",marginBottom:"10px"}}>Material Palette</div><div style={{display:"flex",flexWrap:"wrap",gap:"7px"}}>{mb.material_palette.map(m=><span key={m} style={{padding:"5px 13px",borderRadius:"100px",background:"#F3F0EA",border:"1px solid #DDD8CF",fontSize:"12px",color:"#665F55"}}>{m}</span>)}</div></>}</Card>
          {imgPreview&&<div style={{borderRadius:"16px",overflow:"hidden",boxShadow:"0 1px 5px rgba(0,0,0,.06)",position:"relative",minHeight:"200px"}}><img src={imgPreview} alt="Reference" style={{width:"100%",height:"100%",objectFit:"cover",display:"block",minHeight:"220px"}}/><div style={{position:"absolute",bottom:"10px",left:"10px",background:"rgba(26,24,20,.72)",borderRadius:"6px",padding:"4px 10px",fontSize:"11px",color:"#DDD8CF",letterSpacing:".04em"}}>Your Reference</div></div>}
        </div>
        <div className="fu2">
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"18px",fontWeight:"600",color:"#1A1814",marginBottom:"16px"}}>Room-by-Room Direction</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(330px,1fr))",gap:"16px"}}>
            {(mb.rooms||[]).map((room,i)=>(<div key={i} className="room-card" style={{background:"#fff",borderRadius:"14px",padding:"24px",boxShadow:"0 1px 5px rgba(0,0,0,.05)",border:"1.5px solid #EDE8DF"}}>
              <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}><div style={{width:"28px",height:"28px",borderRadius:"50%",background:"#F3F0EA",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"13px",fontWeight:"600",color:"#7C6248",flexShrink:0}}>{i+1}</div><h3 style={{fontFamily:"'Playfair Display',serif",fontSize:"16px",fontWeight:"600",color:"#1A1814"}}>{room.name}</h3></div>
              <p style={{fontSize:"13px",lineHeight:"1.65",color:"#3A3530",fontStyle:"italic",marginBottom:"14px"}}>{room.style_direction}</p>
              {room.key_materials?.length>0&&<div style={{marginBottom:"12px"}}><div style={{fontSize:"10px",fontWeight:"500",color:"#A09890",letterSpacing:".1em",textTransform:"uppercase",marginBottom:"6px"}}>Materials</div><div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>{room.key_materials.map(m=><span key={m} style={{padding:"3px 10px",borderRadius:"100px",background:"#F3F0EA",fontSize:"11px",color:"#665F55"}}>{m}</span>)}</div></div>}
              {room.focal_pieces?.length>0&&<div style={{marginBottom:"12px"}}><div style={{fontSize:"10px",fontWeight:"500",color:"#A09890",letterSpacing:".1em",textTransform:"uppercase",marginBottom:"6px"}}>Key Pieces</div><ul style={{paddingLeft:"15px",margin:0}}>{room.focal_pieces.map(f=><li key={f} style={{fontSize:"12px",color:"#665F55",marginBottom:"4px",lineHeight:"1.5"}}>{f}</li>)}</ul></div>}
              {room.color_notes&&<div style={{borderTop:"1px solid #EDE8DF",paddingTop:"10px",marginTop:"4px"}}><div style={{fontSize:"10px",fontWeight:"500",color:"#A09890",letterSpacing:".1em",textTransform:"uppercase",marginBottom:"5px"}}>Colour Notes</div><p style={{fontSize:"12px",color:"#665F55",lineHeight:"1.5"}}>{room.color_notes}</p></div>}
              {room.lighting&&<div style={{borderTop:"1px solid #EDE8DF",paddingTop:"10px",marginTop:"10px",display:"flex",gap:"6px",alignItems:"flex-start"}}><span style={{fontSize:"14px",flexShrink:0}}>💡</span><p style={{fontSize:"12px",color:"#665F55",lineHeight:"1.5"}}>{room.lighting}</p></div>}
            </div>))}
          </div>
        </div>
        <div className="fu3" style={{background:"#1A1814",borderRadius:"16px",padding:"36px 40px",boxShadow:"0 4px 18px rgba(0,0,0,.12)"}}><div style={{fontSize:"11px",fontWeight:"500",color:"#7C6248",letterSpacing:".16em",textTransform:"uppercase",marginBottom:"16px"}}>Space Simulation</div><p style={{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontSize:"17px",lineHeight:"1.85",color:"#EDE8DF"}}>"{mb.simulation}"</p></div>
        <div className="fu4" style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:"20px"}}>
          <div style={{background:"#F8F4EF",borderRadius:"16px",padding:"26px",border:"1px solid #DDD8CF"}}><div style={{display:"flex",gap:"10px",alignItems:"flex-start",marginBottom:"14px"}}><span style={{fontSize:"20px",lineHeight:1}}>✦</span><h3 style={{fontFamily:"'Playfair Display',serif",fontSize:"16px",fontWeight:"600",color:"#1A1814"}}>Designer Notes</h3></div><p style={{fontSize:"13px",lineHeight:"1.75",color:"#3A3530"}}>{mb.designer_notes}</p></div>
          <Card style={{padding:"26px"}}><h3 style={{fontFamily:"'Playfair Display',serif",fontSize:"16px",fontWeight:"600",color:"#1A1814",marginBottom:"14px"}}>ID Discussion Points</h3><ol style={{paddingLeft:"18px",margin:0}}>{(mb.id_discussion_points||[]).map((pt,i)=><li key={i} style={{fontSize:"13px",color:"#3A3530",marginBottom:"10px",lineHeight:"1.65"}}>{pt}</li>)}</ol></Card>
        </div>
        <div className="fu5" style={{background:"#fff",borderRadius:"16px",padding:"22px 28px",boxShadow:"0 1px 5px rgba(0,0,0,.05)",display:"flex",flexWrap:"wrap",gap:"24px",alignItems:"center"}}>
          {[["Project",form.projectName||"—"],["Homeowner",form.ownerName||"—"],["Rooms",`${form.rooms} rooms`],["Size",form.houseSize?`${form.houseSize} ${form.unit}`:"—"],["Budget",form.budget||"—"]].map(([lbl,val])=>(<div key={lbl}><div style={{fontSize:"10px",fontWeight:"500",color:"#A09890",letterSpacing:".1em",textTransform:"uppercase",marginBottom:"3px"}}>{lbl}</div><div style={{fontSize:"13px",fontWeight:"500",color:"#1A1814"}}>{val}</div></div>))}
        </div>
        <div style={{textAlign:"center",paddingTop:"10px"}}><button type="button" onClick={()=>{setStep("input");setMoodboard(null);}} style={{padding:"14px 40px",borderRadius:"10px",background:"#7C6248",color:"#fff",border:"none",fontSize:"15px",fontWeight:"500",cursor:"pointer",boxShadow:"0 2px 10px rgba(124,98,72,.25)"}}>Generate Another Moodboard</button></div>
      </div>
    </div>
  );
  return null;
}
ReactDOM.createRoot(document.getElementById('root')).render(<MoodboardApp/>);
</script>
</body>
</html>
